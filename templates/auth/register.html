{% extends "base.html" %}
{% block title %}Create account — EthicalHawk Recon{% endblock %}
{% block content %}
<div class="container narrow">
  <h1>Create your account</h1>
  {% include "partials/flash.html" %}
  <div class="card">
    <form method="post" action="/auth/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="10" autocomplete="new-password">
        <p class="field-hint">At least 10 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="10" autocomplete="new-password">
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p style="margin-top:16px; font-size:0.88rem;">Already have an account? <a href="/auth/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
